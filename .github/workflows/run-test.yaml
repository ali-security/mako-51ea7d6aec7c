name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "pytest selector passed through tox posargs (empty = full suite)"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          # ubuntu-latest is ubuntu-26.04, which has no prebuilt CPython 3.7-3.9
          - "ubuntu-22.04"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        if: ${{ !(runner.os == 'macOS' && matrix.python-version == '3.7') }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      # no arm64 CPython 3.7 exists and the x64 toolcache build needs Homebrew's
      # x64 gettext; the python.org 3.7.9 installer is self-contained and runs under Rosetta
      - name: Set up python 3.7 (macOS, python.org installer)
        if: ${{ runner.os == 'macOS' && matrix.python-version == '3.7' }}
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg python-3.7.9-macosx10.9.pkg -target /
          mkdir -p "$HOME/py37bin"
          ln -sf /Library/Frameworks/Python.framework/Versions/3.7/bin/python3.7 "$HOME/py37bin/python"
          ln -sf /Library/Frameworks/Python.framework/Versions/3.7/bin/pip3.7 "$HOME/py37bin/pip"
          echo "$HOME/py37bin" >> "$GITHUB_PATH"
          echo "/Library/Frameworks/Python.framework/Versions/3.7/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          # runner images ship setuptools 79, incompatible with the packaging 21.3 tox installs
          pip install "setuptools==65.5.1"
          pip list

      - name: Run tests
        run: tox -- ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        run: |
          pip install build
          python -m build

      - name: Upload distributions
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
